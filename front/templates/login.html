{% extends "base.html" %}
{%block content%}
     <div id="login">
        <h3 class="text-center text-white pt-5 titulos">Login</h3>
        <div class="container">
            <div id="login-row" class="row justify-content-center align-items-center">
                <div id="login-column" class="col-md-6">
                    <div id="login-box" class="col-md-12">
                        <form id="login-form" class="form" action="" method="post">
                            <div class="form-group">
                                <label for="username" class="texto-multilinea">Username:</label><br>
                                <input type="text" id="nombre" name="nombre_usuario" class="form-control"  required><br>
                            </div>
                            <div class="form-group">
                                <label for="password" class="texto-multilinea">Password:</label><br>
                                <input type="text" id="nombre" name="contraseña_usuario" class="form-control" required><br>
                            </div>
                            <div class="form-group">
                                <button type="submit"  id="envio" name="submit" class="btn btn-outline-success " value="submit">Login</button>
                            </div>
                            <div class="text-right texto-multilinea">
                                <p></p>
                                <a href="{{url_for('registrarse_bp.registrarse', _external=true)}}" >Registrarse</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{%endblock%}
